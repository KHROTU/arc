name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10 (reads packageManager from package.json)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          pnpm audit --audit-level high
          pnpm audit --prod --audit-level high

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Test and build
        run: |
          pnpm build:ext
          pnpm test
          pnpm --filter arc-code package # vsce directly — scripts/ is untracked

      - name: Resolve version and VSIX
        id: meta
        run: |
          VERSION=$(node -p "require('./packages/arc/package.json').version")
          VSIX="packages/arc/arc-code-${VERSION}.vsix"
          TAG="v${VERSION}"
          if [ ! -f "$VSIX" ]; then echo "VSIX not found after clean build: $VSIX"; exit 1; fi
          sha256sum "$VSIX" > "${VSIX}.sha256"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "vsix=$VSIX" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Generate SBOM
        uses: anchore/sbom-action@65f438523a6c695224053b36fa18a54cb7026ea3 # v0.24.1
        with:
          artifact-name: arc-code-${{ steps.meta.outputs.version }}.spdx.json
          output-file: arc-code-${{ steps.meta.outputs.version }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.vsix }}

      - name: Create Release
        uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          name: v${{ steps.meta.outputs.version }}
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
            arc-code-${{ steps.meta.outputs.version }}.spdx.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
