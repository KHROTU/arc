name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: |
          pnpm audit --audit-level high
          pnpm audit --prod --audit-level high

      - name: Install browser test runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Test and build
        run: |
          pnpm build:ext
          pnpm test
          node scripts/package-ext.mjs

      - name: Resolve version and VSIX
        id: meta
        run: |
          VERSION=$(node -p "require('./packages/arc/package.json').version")
          VSIX="packages/arc/arc-code-${VERSION}.vsix"
          TAG="v${VERSION}"
          if [ ! -f "$VSIX" ]; then echo "VSIX not found after clean build: $VSIX"; exit 1; fi
          sha256sum "$VSIX" > "${VSIX}.sha256"
          SIZE_BYTES=$(stat -c%s "$VSIX")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES}/1024000 }")
          echo "VSIX size: ${SIZE_BYTES} bytes (${SIZE_MB} MB)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "vsix=$VSIX" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          artifact-name: arc-code-${{ steps.meta.outputs.version }}.spdx.json
          output-file: arc-code-${{ steps.meta.outputs.version }}.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.meta.outputs.vsix }}

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: v${{ steps.meta.outputs.version }}
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
            arc-code-${{ steps.meta.outputs.version }}.spdx.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
