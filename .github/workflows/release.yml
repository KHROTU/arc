name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and VSIX
        id: meta
        run: |
          VERSION=$(node -p "require('./packages/arc/package.json').version")
          VSIX="packages/arc/arc-code-${VERSION}.vsix"
          TAG="v${VERSION}"
          if [ ! -f "$VSIX" ]; then echo "VSIX not found: $VSIX"; exit 1; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "vsix=$VSIX" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.meta.outputs.version }}
          tag_name: ${{ steps.meta.outputs.tag }}
          files: ${{ steps.meta.outputs.vsix }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
